minimumReleaseAgeExclude:
  - '@types/node'

overrides:
  cosmiconfig: '10.0' # v9.0 does not support TypeScript 7 (https://github.com/cosmiconfig/cosmiconfig/issues/350)
  vite@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
